x-postgres-environment: &postgres-environment
  POSTGRES_DB: "${POSTGRES_DB:-doordish}"
  POSTGRES_USER: "${POSTGRES_USER:-doordish}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-doordish-dev}"

services:
  db:
    image: postgres:18
    environment: *postgres-environment
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15
  web:
    build: .
    environment:
      <<: *postgres-environment
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DOORDISH_PORT:-8000}:8000"

volumes:
  postgres_data:
